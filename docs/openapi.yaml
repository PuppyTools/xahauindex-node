              $ref: '#/components/examples/BadRequest'

paths:
  /v1/status:
    get:
      operationId: getStatus
      tags: [status]
      summary: Indexer health, snapshot, and sync status
      x-try: /v1/status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Status'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                live:
                  $ref: '#/components/examples/StatusLive'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: List indexed IOU tokens
      x-try: /v1/tokens?per_page=5
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sort_tokens'
        - name: issuer
          in: query
          description: Filter by issuer r-address
          schema:
            type: string
        - name: currency
          in: query
          description: Filter by 3-character code or 40-character hex
          schema:
            type: string
        - name: domain_verified
          in: query
          description: If true, only tokens whose issuer passed `xahau.toml` verification
          schema:
            type: boolean
        - name: q
          in: query
          description: Search by name or currency
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                tokens:
                  $ref: '#/components/examples/TokenList'

  /v1/tokens/{currency}/{issuer}:
    get:
      operationId: getToken
      tags: [tokens]
      summary: Single token with full metadata
      parameters:
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/issuer'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                token:
                  $ref: '#/components/examples/TokenDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tokens/{currency}/{issuer}/holders:
    get:
      operationId: listTokenHolders
      tags: [tokens]
      summary: Trust lines / holders for a token
      parameters:
        - $ref: '#/components/parameters/currency'
        - $ref: '#/components/parameters/issuer'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: nonzero
          in: query
          description: If true, only balances that are not zero
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrustLine'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                holders:
                  $ref: '#/components/examples/TokenHolders'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/uritokens:
    get:
      operationId: listURITokens
      tags: [uritokens]
      summary: List URITokens with resolved metadata
      x-try: /v1/uritokens?per_page=5
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: sort
          in: query
          description: Sort by `mint_ledger` or `last_updated`
          schema:
            type: string
            enum: [mint_ledger, last_updated]
            default: mint_ledger
        - name: issuer
          in: query
          description: Filter by issuer r-address
          schema:
            type: string
        - name: owner
          in: query
          description: Filter by current owner r-address
          schema:
            type: string
        - name: burned
          in: query
          description: Include burned tokens. Default false
          schema:
            type: boolean
            default: false
        - name: for_sale
          in: query
          description: If true, only tokens with an active sell offer
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/URIToken'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                uritokens:
                  $ref: '#/components/examples/URITokenList'

  /v1/uritokens/{id}:
    get:
      operationId: getURIToken
      tags: [uritokens]
      summary: Single URIToken with remarks and transfer history
      parameters:
        - name: id
          in: path
          required: true
          description: URITokenID (64 hex characters)
          schema:
            type: string
            pattern: '^[A-Fa-f0-9]{64}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/URITokenDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                uritoken:
                  $ref: '#/components/examples/URITokenDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/issuers:
    get:
      operationId: listIssuers
      tags: [issuers]
      summary: List issuer profiles
      x-try: /v1/issuers?per_page=5
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: sort
          in: query
          description: Sort by `token_count` or `first_ledger`
          schema:
            type: string
            enum: [token_count, first_ledger]
            default: token_count
        - name: domain_verified
          in: query
          description: If true, only issuers that passed `xahau.toml` verification
          schema:
            type: boolean
        - name: has_hooks
          in: query
          description: If true, only issuers that currently own a Hook object
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issuer'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                issuers:
                  $ref: '#/components/examples/IssuerList'

  /v1/issuers/{account}:
    get:
      operationId: getIssuer
      tags: [issuers]
      summary: Issuer profile with remarks, tokens, and Hook state
      parameters:
        - name: account
          in: path
          required: true
          description: Issuer r-address
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssuerDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                issuer:
                  $ref: '#/components/examples/IssuerDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/prices/{base}/{counter}:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Historical OHLCV candles for a pair
      description: |
        Calendar-aligned UTC candles. History starts at `history_start_ledger`.

        Examples:
        - `/v1/prices/USD/XAH?base_issuer=rHb9…&period=1h&from=1717200000&to=1717286400`
        - `/v1/prices/USD/EUR?base_issuer=rA…&counter_issuer=rB…&from_ledger=9000000&to_ledger=9001000`
      parameters:
        - $ref: '#/components/parameters/base'
        - $ref: '#/components/parameters/counter'
        - $ref: '#/components/parameters/base_issuer'
        - $ref: '#/components/parameters/counter_issuer'
        - name: period
          in: query
          description: Calendar candle size. `1h`, `24h`, or `7d` (default 24h)
          schema:
            type: string
            enum: ['1h', '24h', '7d']
            default: '24h'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/from_ledger'
        - $ref: '#/components/parameters/to_ledger'
        - $ref: '#/components/parameters/range_limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OHLCVCandle'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                candles:
                  $ref: '#/components/examples/Prices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/trades/{base}/{counter}:
    get:
      operationId: getTrades
      tags: [prices]
      summary: Executed DEX trades for a pair
      parameters:
        - $ref: '#/components/parameters/base'
        - $ref: '#/components/parameters/counter'
        - $ref: '#/components/parameters/base_issuer'
        - $ref: '#/components/parameters/counter_issuer'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/from_ledger'
        - $ref: '#/components/parameters/to_ledger'
        - $ref: '#/components/parameters/range_limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DexTrade'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                trades:
                  $ref: '#/components/examples/Trades'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/hooks/definitions:
    get:
      operationId: listHookDefinitions
      tags: [hooks]
      summary: List indexed HookDefinition objects
      description: Shared HookDefinition metadata (`code_size`, defaults, fees). Bytecode is not stored.
      x-try: /v1/hooks/definitions?per_page=5
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HookDefinition'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                definitions:
                  $ref: '#/components/examples/HookDefinitions'

  /v1/hooks/definitions/{hook_hash}:
    get:
      operationId: getHookDefinition
      tags: [hooks]
      summary: One HookDefinition by hash
      parameters:
        - name: hook_hash
          in: path
          required: true
          description: HookDefinition hash (64 hex characters)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HookDefinition'
                  meta:
                    $ref: '#/components/schemas/Meta'
              examples:
                definition:
                  $ref: '#/components/examples/HookDefinition'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/hooks/{account}:
    get:
      operationId: getHooks
      tags: [hooks]
      summary: Hook state for a Xahau account
