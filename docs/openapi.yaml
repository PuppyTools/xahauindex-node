              $ref: '#/components/examples/RateLimited'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              $ref: '#/components/examples/NotFound'
    BadRequest:
