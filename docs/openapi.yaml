openapi: 3.1.0

info:
  title: XahauIndex API
  version: 1.0.0
  description: |
    Self-hostable metadata indexer for the Xahau network.
    Covers IOU tokens, URITokens, issuer profiles, DEX prices, and Hook activity.

    Token URLs use two path segments: `/v1/tokens/{currency}/{issuer}`.
    Pair URLs use `/v1/prices/{base}/{counter}` with issuer query params.
    Native asset code is `XAH`.
    No API key. Operators may enable a per-IP HTTP limit (`API_RATE_LIMIT_MAX`);
    over the limit the API returns `429` with `error.code` `RATE_LIMITED`.
  contact:
    url: https://github.com/PuppyTools/xahauindex-node
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local instance

x-docs:
  kicker: Xahau network · self-hosted
  headline: Self-hostable data layer for your wallet, explorer, or dapp.
  lede: >
    XahauIndex snapshots the current ledger, follows it live, and serves enriched
    REST + WebSocket APIs for IOUs, URITokens, issuer profiles, DEX candles, and Hooks.
    No API key. Operators can turn on a per-IP rate limit. Put a reverse proxy in front if you want TLS.
  notice: >
    XahauIndex is an independent [PuppyTools](https://github.com/PuppyTools) project.
    It is not affiliated with, endorsed by, or a product of the
    [Xahau](https://xahau.network) network or its operators. The XI mark is original
    artwork inspired by the official letterforms in
    [Xahau/Graphics](https://github.com/Xahau/Graphics).
  donate:
    label: Donations in XAH
    address: rPUPpkfohJsWVoXoXDbNZ7zKfk2FBB8Xwo
  try:
    title: Try this node
    body: Feel free to test this instance. These are the limits on this process.
  conventions:
    - title: Response envelope
      body: >
        Lists and details return `{ data, meta }`. `meta.ledger_index` is the ledger
        this node had applied when it answered. Paginated lists also include `count`,
        `page`, and `per_page`.
    - title: Token URLs
      body: >
        `/v1/tokens/{currency}/{issuer}` — e.g. `/v1/tokens/USD/rHb9…`. Currency is a
        3-character code or 40-character hex. Issuer is an r-address.
    - title: Pair URLs
      body: >
        `/v1/prices/{base}/{counter}` with `base_issuer` / `counter_issuer` when that
        side is an IOU. Native `XAH` has a null issuer and needs no issuer query.
    - title: Amounts
      body: >
        IOU values stay decimal strings (including scientific notation from the ledger).
        XAH drops are converted to XAH for DEX quantities. Icon fields are HTTPS/IPFS
        links only — this node never caches image bytes.
  recipes:
    - title: Wallet
      body: >
        Token list: `GET /v1/tokens?q=` or filter `domain_verified=true`. Show `icon_url`,
        `toml_links`, `blackholed`. URITokens the user owns: `GET /v1/uritokens?owner={account}`.
        Issuer badge: `GET /v1/issuers/{account}` — `domain_verified` is Xahau `xahau.toml` only.
    - title: Explorer
      body: >
        Health: `GET /v1/status` (`ledger_index` vs network tip). Holders:
        `/v1/tokens/{currency}/{issuer}/holders`. NFT: `/v1/uritokens/{id}` (`metadata`,
        remarks, transfers).         Hooks: `/v1/hooks/{account}` — `triggers` for HookOn,
        `definition.code_size` without downloading WASM.
    - title: DEX UI
      body: >
        Candles: `GET /v1/prices/{base}/{counter}?period=1h&from=&to=`. Tape:
        `/v1/trades/{base}/{counter}`. Native XAH has a null issuer — omit the issuer
        query. Live: subscribe to `prices`.
  schema_cards:
    - Token
    - URIToken
    - Issuer
    - HookEntry
    - HookDefinition
    - OHLCVCandle
    - Status

x-cookbook:
  - title: Wait for the snapshot
    note: "Token, URIToken, issuer, and Hook lists stay empty until `snapshot_status` is `complete`."
    curl: |
      curl -s http://localhost:3000/v1/status
  - title: List verified tokens
    curl: |
      curl -s 'http://localhost:3000/v1/tokens?domain_verified=true&per_page=5'
  - title: Token detail
    curl: |
      curl -s http://localhost:3000/v1/tokens/USD/rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh
  - title: Token holders
    curl: |
      curl -s 'http://localhost:3000/v1/tokens/USD/rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh/holders?nonzero=true'
  - title: URITokens for an owner
    curl: |
      curl -s 'http://localhost:3000/v1/uritokens?owner=rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh&per_page=5'
  - title: URIToken detail
    note: "`id` is the 64-character hex URITokenID. Packed on-chain URIs return `metadata.source: \"onchain\"`."
    curl: |
      curl -s http://localhost:3000/v1/uritokens/CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
  - title: Issuer profile
    curl: |
      curl -s http://localhost:3000/v1/issuers/rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh
  - title: OHLCV candles
    curl: |
      curl -s 'http://localhost:3000/v1/prices/USD/XAH?base_issuer=rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh&period=1h&limit=24'
  - title: DEX trade tape
    curl: |
      curl -s 'http://localhost:3000/v1/trades/USD/XAH?base_issuer=rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh&per_page=5'
  - title: Account hook state
    curl: |
      curl -s http://localhost:3000/v1/hooks/rHktfGUbjqzU4GsYCMc1pDjdHXb5CJamto
  - title: Hook definitions
    curl: |
      curl -s 'http://localhost:3000/v1/hooks/definitions?per_page=5'
  - title: WebSocket subscribe
    note: >
      Not a xahaud `ledger` / `transactions` subscribe. Those sockets emit raw
      protocol traffic. This one pushes the same enriched objects as REST
      (`tokens`, `uritokens`, `prices`, `hooks`) after this node has indexed them.
    curl: |
      npx wscat -c ws://localhost:3000/v1/subscribe
      # then send:
      # {"command":"subscribe","streams":["tokens","uritokens","prices","hooks"]}

tags:
  - name: status
    description: Indexer health, snapshot, and sync status. Use this to know whether balances are still catching the snapshot.
  - name: tokens
    description: IOU token metadata, remarks, and trust-line statistics
  - name: uritokens
    description: URIToken (Xahau native NFT) metadata and lifecycle
  - name: issuers
    description: Issuer profiles with domain verification and remarks
  - name: prices
    description: DEX-derived historical OHLCV and trade tape
  - name: hooks
    description: >
      Accounts that currently own a `Hook` ledger object. Each slot includes the
      install fields plus the shared `HookDefinition`. HookOn bitmasks become
      `triggers`. WASM is not stored. Empty slots are dropped.
  - name: subscribe
    description: >
      Indexed metadata streams on the same port as REST. This is not xahaud
      WebSocket `subscribe` (`ledger`, `transactions`, books). Use a public or
      self-hosted xahaud socket for the raw firehose; use this for live token,
      URIToken, price, and hook objects already mapped like the REST API.

components:
  parameters:
    page:
      name: page
      in: query
      description: Page number. Default 1
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      description: Rows per page (1–100). Default 20
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    sort_tokens:
      name: sort
      in: query
      description: Sort by `holder_count`, `trust_count`, or `first_ledger`
      schema:
        type: string
        enum: [holder_count, trust_count, first_ledger]
        default: holder_count
    currency:
      name: currency
      in: path
      required: true
      description: 3-character currency code or 40-character hex
      schema:
        type: string
    issuer:
      name: issuer
      in: path
      required: true
      description: Issuer r-address
      schema:
        type: string
    base:
      name: base
      in: path
      required: true
      description: Base currency code (`XAH` or IOU code / hex)
      schema:
        type: string
    counter:
      name: counter
      in: path
      required: true
      description: Counter currency code (`XAH` or IOU code / hex)
      schema:
        type: string
    base_issuer:
      name: base_issuer
      in: query
      description: Required when `base` is not `XAH`
      schema:
        type: string
    counter_issuer:
      name: counter_issuer
      in: query
      description: Required when `counter` is not `XAH`
      schema:
        type: string
    from:
      name: from
      in: query
      description: Inclusive unix timestamp (seconds)
      schema:
        type: integer
        minimum: 0
    to:
      name: to
      in: query
      description: Exclusive unix timestamp (seconds)
      schema:
        type: integer
        minimum: 0
    from_ledger:
      name: from_ledger
      in: query
      description: Inclusive ledger index
      schema:
        type: integer
        minimum: 1
    to_ledger:
      name: to_ledger
      in: query
      description: Inclusive ledger index
      schema:
        type: integer
        minimum: 1
    range_limit:
      name: limit
      in: query
      description: Max rows when no range is given (or cap when a range is given)
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  schemas:
    Meta:
      type: object
      required: [ledger_index]
      properties:
        count:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        ledger_index:
          type: integer
          description: Ledger index at time of response
        history_start_ledger:
          type: integer
          description: Earliest ledger this node has price/transfer history for (backfill frontier while running, backfill_from when complete, else live_from_ledger)

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
              description: "`NOT_FOUND`, `BAD_REQUEST`, `RATE_LIMITED`, or `INTERNAL`"
            message:
              type: string

    Remarks:
      type: object
      additionalProperties:
        type: string
      description: Decoded remark name/value map

    TomlLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
        type:
          type: string
          nullable: true
          description: Normalized kind (`website`, `social`, or the TOML type)
        title:
          type: string
          nullable: true

    Token:
      type: object
      required: [id, currency, issuer, holder_count, trust_count, domain_verified, blackholed, first_ledger]
      properties:
        id:
          type: string
          description: Internal `currency:issuer`
          example: "USD:rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh"
        currency:
          type: string
          description: Display code
          example: "USD"
        currency_hex:
          type: string
          nullable: true
        issuer:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        icon_url:
          type: string
          nullable: true
          description: Token icon URL from remarks or the issuer TOML. Stored as a link only; images are not cached.
        website_url:
          type: string
          nullable: true
        toml_links:
          type: array
          items:
            $ref: '#/components/schemas/TomlLink'
        supply:
          type: string
          nullable: true
          description: Sum of non-issuer holder balances, decimal string
        holder_count:
          type: integer
          description: Non-zero holders
        trust_count:
          type: integer
          description: All trust lines
        domain_verified:
          type: boolean
          description: Copied from the issuer (`xahau.toml` only)
        blackholed:
          type: boolean
          description: Copied from the issuer
        first_ledger:
          type: integer
        last_updated:
          type: integer
        remarks:
          $ref: '#/components/schemas/Remarks'

    TokenDetail:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          properties:
            issuer_profile:
              $ref: '#/components/schemas/Issuer'
            price:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/PriceSummary'

    TrustLine:
      type: object
      required: [account, currency, issuer, balance]
      properties:
        account:
          type: string
        currency:
          type: string
        issuer:
          type: string
        balance:
          type: string
        limit_peer:
          type: string
        flags:
          type: integer
          nullable: true
        remarks:
          $ref: '#/components/schemas/Remarks'

    URIToken:
      type: object
      required: [id, issuer, owner, burned, mint_ledger]
      properties:
        id:
          type: string
          description: URITokenID
        uri:
          type: string
          nullable: true
          description: Decoded URI
        uri_raw:
          type: string
          description: Original hex URI blob
        uri_kind:
          type: string
          enum: [https, ipfs, image, onchain, empty]
          description: How the URI is interpreted. `onchain` means the 256-byte URI is packed data, not a URL.
        digest:
          type: string
          nullable: true
        issuer:
          type: string
        owner:
          type: string
        flags:
          type: integer
          nullable: true
        sell_offer:
          nullable: true
          oneOf:
            - type: string
              description: XAH amount in drops
            - type: object
              required: [value, currency, issuer]
              properties:
                value:
                  type: string
                currency:
                  type: string
                issuer:
                  type: string
        destination:
          type: string
          nullable: true
          description: Restricted buyer on the active sell offer
        burned:
          type: boolean
        burn_ledger:
          type: integer
          nullable: true
        mint_ledger:
          type: integer
        last_updated:
          type: integer
        icon_url:
          type: string
          nullable: true
          description: On-ledger or URI-metadata image link. The indexer stores the URL only and never caches image bytes.
        metadata:
          nullable: true
          description: >
            Fetched HTTPS JSON when the URI is a document URL. When the URI is
            packed on-chain data (Evernode `evrlease`, printable text, or raw
            bytes), this is a decoded object with `source: onchain` instead.
        remarks:
          $ref: '#/components/schemas/Remarks'
        transfer_count:
          type: integer

    URITokenDetail:
      allOf:
        - $ref: '#/components/schemas/URIToken'
        - type: object
          properties:
            transfers:
              type: array
              items:
                $ref: '#/components/schemas/URITokenTransfer'

    URITokenTransfer:
      type: object
      required: [from_account, to_account, ledger_index, tx_hash]
      properties:
        from_account:
          type: string
        to_account:
          type: string
        price:
          type: string
          nullable: true
        ledger_index:
          type: integer
        tx_hash:
          type: string

    Issuer:
      type: object
      required: [account, domain_verified, has_hooks, first_ledger]
      properties:
        account:
          type: string
        domain:
          type: string
          nullable: true
          description: Printable AccountRoot Domain
        domain_verified:
          type: boolean
          description: True only when `/.well-known/xahau.toml` lists this r-address
        email_hash:
          type: string
          nullable: true
        transfer_rate:
          type: integer
          nullable: true
        flags:
          type: integer
          nullable: true
        blackholed:
          type: boolean
        toml_name:
          type: string
          nullable: true
        toml_description:
          type: string
          nullable: true
        toml_icon_url:
          type: string
          nullable: true
        toml_links:
          type: array
          items:
            $ref: '#/components/schemas/TomlLink'
        has_hooks:
          type: boolean
        token_count:
          type: integer
        first_ledger:
          type: integer
        last_updated:
          type: integer
        remarks:
          $ref: '#/components/schemas/Remarks'

    IssuerDetail:
      allOf:
        - $ref: '#/components/schemas/Issuer'
        - type: object
          properties:
            tokens:
              type: array
              items:
                $ref: '#/components/schemas/Token'
            hooks:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/HookState'

    PriceSummary:
      type: object
      properties:
        price:
          type: number
          description: Last trade price (counter per base)
        change_24h:
          type: number
          nullable: true
        volume_24h:
          type: string
          nullable: true
        high_24h:
          type: number
          nullable: true
        low_24h:
          type: number
          nullable: true

    OHLCVCandle:
      type: object
      required: [open_time, open, high, low, close, volume, trade_count]
      properties:
        open_time:
          type: integer
          description: UTC period start, unix seconds
        open_ledger:
          type: integer
          nullable: true
        close_ledger:
          type: integer
          nullable: true
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: string
          description: Base-side decimal string
        trade_count:
          type: integer

    DexTrade:
      type: object
      required: [price, base_amount, counter_amount, ledger_index, close_time, tx_hash]
      properties:
        base_currency:
          type: string
        base_issuer:
          type: string
          nullable: true
        counter_currency:
          type: string
        counter_issuer:
          type: string
          nullable: true
        price:
          type: number
        base_amount:
          type: string
        counter_amount:
          type: string
        taker:
          type: string
        maker:
          type: string
        ledger_index:
          type: integer
        close_time:
          type: integer
        tx_hash:
          type: string

    HookLabel:
      type: object
      required: [name, project, description, url, source]
      description: |
        Read-time catalog name. Hash match wins; if the hash is unknown the install
        account is checked (Evernode system accounts stay labeled after a hash rotation).
      properties:
        name:
          type: string
          example: Evernode heartbeat
        project:
          type: string
          example: Evernode
        description:
          type: string
        url:
          type: string
        source:
          type: string
          enum: [catalog]

    HookTriggerMask:
      type: object
      required: [raw, mode, types]
      properties:
        raw:
          type: string
        mode:
          type: string
          enum: [all_except, only, none]
        types:
          type: array
          items:
            type: string

    HookDefinition:
      type: object
      required: [hook_hash, code_size]
      properties:
        hook_hash:
          type: string
        label:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HookLabel'
        hook_namespace:
          type: string
          nullable: true
        hook_on:
          type: string
          nullable: true
        hook_on_incoming:
          type: string
          nullable: true
        hook_on_outgoing:
          type: string
          nullable: true
        hook_can_emit:
          type: string
          nullable: true
        hook_name:
          type: string
          nullable: true
        hook_api_version:
          type: integer
          nullable: true
        parameters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
        reference_count:
          type: integer
          nullable: true
        code_size:
          type: integer
        hook_fee:
          type: string
          nullable: true
        hook_callback_fee:
          type: string
          nullable: true
        hook_set_txn_id:
          type: string
          nullable: true
        flags:
          type: integer
          nullable: true
        triggers:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HookTriggerMask'
        triggers_incoming:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HookTriggerMask'
        triggers_outgoing:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HookTriggerMask'
        can_emit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HookTriggerMask'
        first_ledger:
          type: integer
        last_updated:
          type: integer

    HookEntry:
      type: object
      required: [hook_hash]
      properties:
        hook_hash:
          type: string
          description: SHA-512Half of the WASM — the HookDefinition id
        label:
          nullable: true
          description: Static catalog name when the hash or Evernode system account is known
          allOf:
            - $ref: '#/components/schemas/HookLabel'
        hook_on:
          type: string
          nullable: true
        hook_on_incoming:
          type: string
          nullable: true
        hook_on_outgoing:
          type: string
          nullable: true
        hook_can_emit:
          type: string
          nullable: true
        hook_namespace:
          type: string
          nullable: true
        hook_name:
          type: string
          nullable: true
          description: NamedHooks trigger (4–16 bytes), not a product title
        hook_api_version:
          type: integer
          nullable: true
        parameters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
        grants:
          type: array
          items:
            type: object
            properties:
              account:
                type: string
              hook_hash:
                type: string
        triggers:
          nullable: true
          description: Decoded HookOn (`all_except`, `only`, or `none`)
          allOf:
            - $ref: '#/components/schemas/HookTriggerMask'
        definition:
          nullable: true
          description: Shared defaults, `code_size`, fees. No bytecode
          allOf:
            - $ref: '#/components/schemas/HookDefinition'

    HookState:
      type: object
      required: [account, hook_count, hooks]
      properties:
        account:
          type: string
        hook_count:
          type: integer
        hooks:
          type: array
          items:
            $ref: '#/components/schemas/HookEntry'
        first_ledger:
          type: integer
        last_updated:
          type: integer

    Status:
      type: object
      required: [status, ledger_index, indexed_ledgers, uptime_seconds]
      properties:
        status:
          type: string
          enum: [syncing, live, degraded]
          description: "`syncing` while the snapshot is unfinished · `live` when current · `degraded` if lag grows"
        snapshot_status:
          type: string
          enum: [pending, running, complete]
          description: Token, URIToken, issuer, and Hook lists stay empty until `complete`
        snapshot_ledger:
          type: integer
          nullable: true
          description: Ledger the snapshot walked. Restarting a complete node does not re-walk those objects
        history_start_ledger:
          type: integer
          nullable: true
          description: Earliest ledger with collected history (backfill frontier while walking down, backfill_from when complete, else live_from_ledger)
        backfill_status:
          type: string
          enum: [idle, running, complete]
          description: Optional historical walk (DEX trades + URIToken transfers only)
        backfill_from:
          type: integer
          nullable: true
          description: Earliest ledger the historical backfill walks down to
        backfill_ledger:
          type: integer
          nullable: true
          description: Lowest historical ledger successfully applied so far (walks snapshot → FROM)
        ledger_index:
          type: integer
        network_ledger_index:
          type: integer
          nullable: true
        lag_ledgers:
          type: integer
          nullable: true
          description: Network tip minus last applied ledger
        indexed_ledgers:
          type: integer
        token_count:
          type: integer
        uri_token_count:
          type: integer
        issuer_count:
          type: integer
        uptime_seconds:
          type: integer

  examples:
    NotFound:
      value:
        error:
          code: NOT_FOUND
          message: Token USD/rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh not found
    BadRequest:
      value:
        error:
          code: BAD_REQUEST
          message: base_issuer is required when base is not XAH
    RateLimited:
      value:
        error:
          code: RATE_LIMITED
          message: Too many requests
    StatusLive:
      value:
        data:
