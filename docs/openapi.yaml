  /v1/subscribe:
    get:
      operationId: subscribe
      tags: [subscribe]
      summary: Indexed token, URIToken, price, and hook streams
      description: >
        Not a stand-in for `wss://xahau.network` or your own xahaud WebSocket.
        xahaud `subscribe` emits raw ledgers, transactions, and books. This
        endpoint emits the objects this node has already indexed — the same
        shapes as `GET /v1/tokens`, `/v1/uritokens`, `/v1/trades`, and
        `/v1/hooks`, including remarks, issuer fields, and decoded HookOn.
        Streams are `tokens`, `uritokens`, `prices`, and `hooks`. One
        connection, multiple streams, same HTTP port (no separate WS host).
        `unsubscribe` uses the same shape. Unknown commands and invalid JSON
        return the standard `error` object. When the operator cap is on, extra
        sockets from the same IP are rejected with `RATE_LIMITED`.
      x-websocket: true
      x-messages:
        - title: Subscribe
          value:
            command: subscribe
            streams: [tokens, uritokens, prices, hooks]
        - title: Ack
          value:
            type: subscribed
            streams: [tokens, prices]
        - title: Event
          value:
            stream: tokens
            event: update
            ledger_index: 26272654
            data:
              currency: USD
              issuer: rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh
      responses:
        '200':
          description: JSON messages after the WebSocket upgrade
          content:
            application/json:
              examples:
                subscribed:
                  $ref: '#/components/examples/SubscribeAck'
                event:
                  $ref: '#/components/examples/SubscribeEvent'
        '429':
          $ref: '#/components/responses/RateLimited'
