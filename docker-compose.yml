services:
  xahauindex:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/xahauindex.db
      API_HOST: 0.0.0.0
      # Host paths from .env are bind-mounted below; the process sees these container paths.
      HISTORY_CATALOGUE: ${HISTORY_CATALOGUE:+/import/catalogue}
      HISTORY_LEDGER_DB: ${HISTORY_LEDGER_DB:+/import/ledger.db}
      HISTORY_TX_DB: ${HISTORY_TX_DB:+/import/transaction.db}
    volumes:
      - xahauindex_data:/data
      - ${HISTORY_CATALOGUE:-./docker/empty-import}:/import/catalogue:ro
      - ${HISTORY_LEDGER_DB:-./docker/empty-import}:/import/ledger.db:ro
      - ${HISTORY_TX_DB:-./docker/empty-import}:/import/transaction.db:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/status').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  xahauindex_data:
